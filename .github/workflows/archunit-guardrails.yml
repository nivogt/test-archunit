name: Test ArchUnit License Guardrails

permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ['10.0.x']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./

    - name: Build solution
      run: dotnet build --configuration Release --no-restore
      working-directory: ./

    - name: Run Architecture Tests (License Compliance)
      run: dotnet test src/TestArchUnit.Architecture/TestArchUnit.Architecture.csproj --configuration Release --no-build --logger "console;verbosity=detailed" --logger "trx;LogFileName=test-results.trx"
      working-directory: ./

    - name: Run All Tests
      run: dotnet test --configuration Release --no-build --logger "console;verbosity=detailed"
      working-directory: ./

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: '**/test-results.trx'

    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: '**/test-results.trx'
        check_name: Test Results
        comment_mode: always
        github_token: ${{ secrets.GITHUB_TOKEN }}
